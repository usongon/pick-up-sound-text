<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pick-up-sound-text</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" data-tab="file">文件转字幕</button>
            <button class="tab" data-tab="realtime">实时字幕</button>
            <button class="tab" data-tab="settings">设置</button>
        </div>

        <div class="tab-content" id="file-tab">
            <div class="drop-zone" id="drop-zone">
                <p>拖拽视频文件到这里，或点击选择文件</p>
                <p class="hint">支持格式: mp4 / mkv / avi / mov ...</p>
                <input type="file" id="file-input" accept="video/*" style="display: none;">
            </div>

            <div class="task-list" id="task-list">
                <!-- Tasks will be added here -->
            </div>
            
            <div id="export-section" style="display: none; margin-top: 20px;">
                <h3>导出字幕</h3>
                <button id="export-srt-btn" class="primary-btn">导出 SRT</button>
                <button id="export-vtt-btn" class="primary-btn">导出 VTT</button>
                <div id="export-status" class="status-message"></div>
            </div>
        </div>

        <div class="tab-content" id="realtime-tab" style="display: none;">
            <p>实时字幕功能开发中...</p>
        </div>

        <div class="tab-content" id="settings-tab" style="display: none;">
            <div class="settings-form">
                <h2>ASR 配置（语音识别）</h2>
                <div class="form-group">
                    <label for="asr-provider">渠道</label>
                    <select id="asr-provider">
                        <option value="dashscope">百炼（DashScope）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="asr-model">模型</label>
                    <input type="text" id="asr-model" value="paraformer-realtime-v2" readonly>
                </div>
                <div class="form-group">
                    <label for="asr-api-key">API Key</label>
                    <input type="password" id="asr-api-key" placeholder="输入百炼 API Key">
                </div>
                <div class="form-group">
                    <label for="asr-language">语言</label>
                    <select id="asr-language">
                        <option value="auto">自动识别</option>
                        <option value="zh">中文</option>
                        <option value="en">英文</option>
                        <option value="ja">日文</option>
                        <option value="ko">韩文</option>
                    </select>
                </div>
                <button id="test-asr-btn" class="secondary-btn">测试 ASR 连通性</button>
                <div id="asr-test-status" class="status-message"></div>

                <h2>翻译配置</h2>
                <div class="form-group">
                    <label for="translate-provider">渠道</label>
                    <select id="translate-provider">
                        <option value="openai">OpenAI</option>
                        <option value="dashscope">百炼（DashScope）</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="kimi">Kimi</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="translate-base-url">Base URL</label>
                    <input type="text" id="translate-base-url" value="https://api.openai.com/v1">
                </div>
                <div class="form-group">
                    <label for="translate-model">模型</label>
                    <input type="text" id="translate-model" value="gpt-3.5-turbo">
                </div>
                <div class="form-group">
                    <label for="translate-api-key">API Key</label>
                    <input type="password" id="translate-api-key" placeholder="输入翻译 API Key">
                </div>
                <div class="form-group">
                    <label for="translate-target-lang">目标语言</label>
                    <select id="translate-target-lang">
                        <option value="zh">中文</option>
                        <option value="en">英文</option>
                        <option value="ja">日文</option>
                        <option value="ko">韩文</option>
                    </select>
                </div>
                <button id="test-translate-btn" class="secondary-btn">测试翻译连通性</button>
                <div id="translate-test-status" class="status-message"></div>

                <button id="save-config-btn" class="primary-btn">保存配置</button>
                <div id="config-status" class="status-message"></div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
